[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pharmviginet"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=4.40",
    "datasets>=2.18",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "pyarrow>=15",
    "tqdm",
    "rich",
    "requests",
    "beautifulsoup4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pharmviginet*"]
